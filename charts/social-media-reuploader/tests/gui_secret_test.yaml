suite: GUI Secret
templates:
  - templates/gui-secret.yaml
release:
  name: smr
  namespace: bots
tests:
  - it: is created by default with a generated session key and admin token
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: smr-social-media-reuploader-gui-secret
      - matchRegex:
          path: data.SECRET_KEY
          pattern: ^[A-Za-z0-9]{64}$
          decodeBase64: true
      - matchRegex:
          path: data.ADMIN_TOKEN
          pattern: ^[A-Za-z0-9]{48}$
          decodeBase64: true

  - it: stores the given credentials
    set:
      gui.secrets.secretKey: 0123456789abcdef0123456789abcdef
      gui.secrets.adminToken: my-admin-token
    asserts:
      - equal:
          path: data.SECRET_KEY
          value: 0123456789abcdef0123456789abcdef
          decodeBase64: true
      - equal:
          path: data.ADMIN_TOKEN
          value: my-admin-token
          decodeBase64: true

  - it: renders a Secret with only the admin groups set
    set:
      gui.secrets.oauthAdminGroups: authentik Admins,admins
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.OAUTH_ADMIN_GROUPS
          value: authentik Admins,admins
          decodeBase64: true
      - exists:
          path: data.SECRET_KEY
      - exists:
          path: data.ADMIN_TOKEN

  - it: stores every OAuth setting and generates no admin token
    set:
      gui.secrets.oauthClientId: client-id
      gui.secrets.oauthClientSecret: client-secret
      gui.secrets.oauthServerMetadataUrl: https://idp.example.com/.well-known/openid-configuration
      gui.secrets.oauthAuthorizeUrl: https://idp.example.com/authorize
      gui.secrets.oauthTokenUrl: https://idp.example.com/token
      gui.secrets.oauthUserinfoUrl: https://idp.example.com/userinfo
      gui.secrets.oauthJwksUri: https://idp.example.com/jwks
      gui.secrets.oauthScope: openid email
      gui.secrets.oauthRedirectUri: https://admin.example.com/auth
      gui.secrets.oauthAdminGroups: admins
    asserts:
      - equal:
          path: data.OAUTH_CLIENT_ID
          value: client-id
          decodeBase64: true
      - equal:
          path: data.OAUTH_CLIENT_SECRET
          value: client-secret
          decodeBase64: true
      - equal:
          path: data.OAUTH_SERVER_METADATA_URL
          value: https://idp.example.com/.well-known/openid-configuration
          decodeBase64: true
      - equal:
          path: data.OAUTH_AUTHORIZE_URL
          value: https://idp.example.com/authorize
          decodeBase64: true
      - equal:
          path: data.OAUTH_TOKEN_URL
          value: https://idp.example.com/token
          decodeBase64: true
      - equal:
          path: data.OAUTH_USERINFO_URL
          value: https://idp.example.com/userinfo
          decodeBase64: true
      - equal:
          path: data.OAUTH_JWKS_URI
          value: https://idp.example.com/jwks
          decodeBase64: true
      - equal:
          path: data.OAUTH_SCOPE
          value: openid email
          decodeBase64: true
      - equal:
          path: data.OAUTH_REDIRECT_URI
          value: https://admin.example.com/auth
          decodeBase64: true
      - equal:
          path: data.OAUTH_ADMIN_GROUPS
          value: admins
          decodeBase64: true
      - exists:
          path: data.SECRET_KEY
      - notExists:
          path: data.ADMIN_TOKEN

  - it: keeps an explicit admin token next to OAuth
    set:
      gui.secrets.oauthClientId: client-id
      gui.secrets.adminToken: automation-token
    asserts:
      - equal:
          path: data.ADMIN_TOKEN
          value: automation-token
          decodeBase64: true

  - it: omits empty OAuth settings
    asserts:
      - notExists:
          path: data.OAUTH_CLIENT_ID
      - notExists:
          path: data.OAUTH_ADMIN_GROUPS

  - it: is not created with an existing Secret
    set:
      gui.existingSecret: gui-creds
    asserts:
      - hasDocuments:
          count: 0

  - it: is not created with the legacy secretName
    set:
      gui.secretName: gui-creds
    asserts:
      - hasDocuments:
          count: 0

  - it: is not created without the GUI
    set:
      gui.enabled: false
    asserts:
      - hasDocuments:
          count: 0
