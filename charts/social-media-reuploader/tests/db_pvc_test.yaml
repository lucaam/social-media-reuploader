suite: DB PVC
templates:
  - templates/db-pvc.yaml
release:
  name: smr
  namespace: bots
tests:
  - it: is created by default (shared by the bot and the GUI)
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: smr-social-media-reuploader-data
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.storageClassName

  - it: survives helm uninstall
    asserts:
      - isSubset:
          path: metadata.annotations
          content:
            helm.sh/resource-policy: keep

  - it: uses the given size and StorageClass
    set:
      db.pvc.size: 2Gi
      db.pvc.storageClass: local-path
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi
      - equal:
          path: spec.storageClassName
          value: local-path

  - it: maps storageClass "-" to an empty StorageClass
    set:
      db.pvc.storageClass: "-"
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""

  - it: is not created for an existing claim
    set:
      db.pvc.existingClaim: old-data
    asserts:
      - hasDocuments:
          count: 0

  - it: is not created without persistence
    set:
      db.pvc.enabled: false
      gui.enabled: false
    asserts:
      - hasDocuments:
          count: 0
