suite: bot token Secret
templates:
  - templates/secret.yaml
release:
  name: smr
  namespace: bots
tests:
  - it: is not created by default
    asserts:
      - hasDocuments:
          count: 0

  - it: is not created for an existing Secret
    set:
      secret.name: smr-bot
    asserts:
      - hasDocuments:
          count: 0

  - it: is created from secret.botToken with a valid name
    set:
      secret.botToken: "123456:SUPERSECRET"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: smr-social-media-reuploader-secret
      - equal:
          path: data.BOT_TOKEN
          value: "123456:SUPERSECRET"
          decodeBase64: true
      - notExists:
          path: data.WEBHOOK_SECRET

  - it: is created with secret.create and the legacy env.BOT_TOKEN
    set:
      secret.create: true
      env.BOT_TOKEN: "123456:LEGACY"
    asserts:
      - equal:
          path: data.BOT_TOKEN
          value: "123456:LEGACY"
          decodeBase64: true

  - it: uses the custom name and keys, with the webhook secret
    set:
      secret.create: true
      secret.name: my-bot-secret
      secret.botTokenKey: token
      secret.webhookSecretKey: hook
      secret.botToken: "123456:SUPERSECRET"
      secret.webhookSecret: webhook-secret-token
    asserts:
      - equal:
          path: metadata.name
          value: my-bot-secret
      - equal:
          path: data.token
          value: "123456:SUPERSECRET"
          decodeBase64: true
      - equal:
          path: data.hook
          value: webhook-secret-token
          decodeBase64: true

  - it: fails when asked to create a Secret without a token
    set:
      secret.create: true
    asserts:
      - failedTemplate:
          errorPattern: "secret.create is true but no bot token was given"
