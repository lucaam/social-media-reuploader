suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: smr
  namespace: bots
tests:
  - it: is created without an automounted API token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: smr-social-media-reuploader-sa
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: uses a custom name and annotations
    set:
      serviceAccount.name: smr-runner
      serviceAccount.annotations:
        example.com/role: media
    asserts:
      - equal:
          path: metadata.name
          value: smr-runner
      - isSubset:
          path: metadata.annotations
          content:
            example.com/role: media

  - it: is not created when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
