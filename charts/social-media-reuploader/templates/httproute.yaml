{{- if .Values.gatewayApi.enabled -}}
{{- if not .Values.gatewayApi.gatewayName -}}
{{- fail "gatewayApi.enabled=true needs gatewayApi.gatewayName (the parent Gateway)" -}}
{{- end -}}
{{- $paths := .Values.gatewayApi.paths -}}
{{- if not $paths -}}
{{- /* Legacy single-path form: gatewayApi.path routed to the GUI. */ -}}
{{- $paths = list (dict "path" (.Values.gatewayApi.path | default "/") "service" "gui") -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "social-media-reuploader.fullname" . }}-httproute
  labels:
    {{- include "social-media-reuploader.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.gatewayName | quote }}
      {{- with .Values.gatewayApi.gatewayNamespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.gatewayApi.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  {{- with .Values.gatewayApi.hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $paths }}
    {{- $backend := include "social-media-reuploader.backend" (list $ .service) | fromYaml }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | default "/" | quote }}
      backendRefs:
        - name: {{ $backend.name }}
          port: {{ $backend.port | int64 }}
    {{- end }}
{{- end }}
