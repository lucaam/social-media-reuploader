{{- $fullname := include "social-media-reuploader.fullname" . -}}
{{- $env := .Values.env | default dict -}}
{{- $replicas := .Values.replicaCount | int -}}
{{- if or (lt $replicas 0) (gt $replicas 1) -}}
{{- fail (printf "replicaCount must be 0 or 1 (got %d): the bot is the only SQLite writer and Telegram allows one consumer of updates per token" $replicas) -}}
{{- end -}}
{{- $mode := include "social-media-reuploader.envString" (get $env "MODE" | default "polling") | lower -}}
{{- if not (has $mode (list "polling" "webhook")) -}}
{{- fail (printf "env.MODE must be polling or webhook (got %q)" $mode) -}}
{{- end -}}
{{- if and (eq $mode "webhook") (not (get $env "WEBHOOK_URL")) -}}
{{- fail "env.MODE=webhook needs env.WEBHOOK_URL (the public HTTPS URL routed to the bot Service)" -}}
{{- end -}}
{{- $tmpDir := include "social-media-reuploader.tmpDir" . -}}
{{- if and .Values.securityContext.readOnlyRootFilesystem (not (hasPrefix "/tmp/" $tmpDir)) -}}
{{- fail (printf "env.TMP_DIR (%s) must be under /tmp/ (the writable emptyDir) while securityContext.readOnlyRootFilesystem is true" $tmpDir) -}}
{{- end -}}
{{- $profile := include "social-media-reuploader.profile" . | fromYaml -}}
{{- $grace := include "social-media-reuploader.gracePeriod" . | int64 -}}
{{- /* Helm drops null keys, so a missing key means "not set". */ -}}
{{- $shutdown := include "social-media-reuploader.envString" (get $env "WORKER_SHUTDOWN_TIMEOUT") -}}
{{- if not $shutdown -}}
{{- $shutdown = max 0 (sub $grace 15) | toString -}}
{{- end -}}
{{- $useCookies := .Values.ytdlpCookies.existingSecret -}}
{{- $cookiesPath := printf "%s/%s" (.Values.ytdlpCookies.mountPath | trimSuffix "/") .Values.ytdlpCookies.key -}}
{{- $skip := list "WORKER_SHUTDOWN_TIMEOUT" -}}
{{- if $useCookies -}}
{{- $skip = append $skip "YTDLP_COOKIES_PATH" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "social-media-reuploader.labels" . | nindent 4 }}
    app.kubernetes.io/component: bot
spec:
  # 0 or 1: one bot process per token (see values.yaml).
  replicas: {{ $replicas }}
  revisionHistoryLimit: 3
  # Recreate: the old pod stops before the new one starts, so two bot
  # processes never poll the same token or write the same SQLite file, and the
  # ReadWriteOnce volume is released first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "social-media-reuploader.selectorLabels" (list . "bot") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "social-media-reuploader.labels" . | nindent 8 }}
        app.kubernetes.io/component: bot
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Restart the bot when the token Secret settings change.
        checksum/secret: {{ list .Values.secret (get $env "BOT_TOKEN") (get $env "WEBHOOK_SECRET") | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "social-media-reuploader.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $grace }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "social-media-reuploader.botAffinity" . }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: social-media-reuploader
          image: {{ include "social-media-reuploader.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort | int64 }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPort | int64 | toString | quote }}
            - name: REQUESTS_DB
              value: {{ include "social-media-reuploader.dbPath" . | quote }}
            {{- if include "social-media-reuploader.useBotSecret" . }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-media-reuploader.botSecretName" . }}
                  key: {{ .Values.secret.botTokenKey | default "BOT_TOKEN" }}
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "social-media-reuploader.botSecretName" . }}
                  key: {{ .Values.secret.webhookSecretKey | default "WEBHOOK_SECRET" }}
                  optional: true
            {{- end }}
            # Let running jobs finish within the pod grace period.
            - name: WORKER_SHUTDOWN_TIMEOUT
              value: {{ $shutdown | quote }}
            {{- if $useCookies }}
            - name: YTDLP_COOKIES_PATH
              value: {{ $cookiesPath | quote }}
            {{- end }}
            {{- with include "social-media-reuploader.renderEnv" (dict "values" $env "source" "env" "target" "bot" "skip" $skip) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            {{- with .Values.probes.startup }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- with .Values.probes.liveness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /ready checks the DB, the worker heartbeat and that updates are
          # being received; /health (liveness) only checks the process.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            {{- with .Values.probes.readiness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- if .Values.resources }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- else }}
            {{- toYaml (dict "requests" $profile.requests "limits" $profile.limits) | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.db.pvc.mountPath | default "/app/data" }}
            - name: tmp
              mountPath: /tmp
            {{- if $useCookies }}
            - name: ytdlp-cookies
              mountPath: {{ .Values.ytdlpCookies.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.db.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "social-media-reuploader.dbClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit | default $profile.tmpSizeLimit | default "4Gi" }}
            {{- with .Values.tmpVolume.medium }}
            medium: {{ . }}
            {{- end }}
        {{- if $useCookies }}
        - name: ytdlp-cookies
          secret:
            secretName: {{ .Values.ytdlpCookies.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.ytdlpCookies.key }}
                path: {{ .Values.ytdlpCookies.key }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
