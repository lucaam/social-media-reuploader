{{- if .Values.gui.enabled -}}
{{- if not .Values.db.pvc.enabled -}}
{{- fail "gui.enabled=true needs db.pvc.enabled=true: the GUI reads the bot's SQLite database from the shared volume (or set gui.enabled=false)" -}}
{{- end -}}
{{- $env := .Values.env | default dict -}}
{{- $guiEnv := .Values.gui.env | default dict -}}
{{- $port := .Values.gui.port | default 8081 | int64 -}}
{{- $skip := list -}}
{{- range $key, $value := $guiEnv -}}
{{- if not (kindIs "invalid" $value) -}}
{{- $skip = append $skip $key -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "social-media-reuploader.guiFullname" . }}
  labels:
    {{- include "social-media-reuploader.labels" . | nindent 4 }}
    app.kubernetes.io/component: gui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "social-media-reuploader.selectorLabels" (list . "gui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "social-media-reuploader.labels" . | nindent 8 }}
        app.kubernetes.io/component: gui
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Restart the GUI when its credentials change (envFrom is not live).
        checksum/gui-secret: {{ list .Values.gui.secrets .Values.gui.existingSecret .Values.gui.secretName | toJson | sha256sum }}
        {{- with .Values.gui.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "social-media-reuploader.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.gui.terminationGracePeriodSeconds | default 30 | int64 }}
      {{- with .Values.gui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.gui.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "social-media-reuploader.guiAffinity" . }}
      # The DB volume is ReadWriteOnce: the GUI must run on the bot's node.
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: social-media-reuploader-gui
          image: {{ include "social-media-reuploader.guiImage" . | quote }}
          imagePullPolicy: {{ .Values.gui.image.pullPolicy | default .Values.image.pullPolicy }}
          {{- if .Values.gui.command }}
          command:
            {{- range .Values.gui.command }}
            - {{ . | toString | quote }}
            {{- end }}
          {{- with .Values.gui.args }}
          args:
            {{- range . }}
            - {{ . | toString | quote }}
            {{- end }}
          {{- end }}
          {{- else }}
          # args (not command) keep the image entrypoint (tini) as PID 1.
          args:
            - uvicorn
            - src.gui:app
            - --host
            - 0.0.0.0
            - --port
            - {{ $port | toString | quote }}
            # Honour X-Forwarded-Proto/For/Host from the ingress (OAuth
            # redirect URI, secure cookies, client address).
            - --proxy-headers
            - --forwarded-allow-ips
            - {{ .Values.gui.forwardedAllowIps | default "127.0.0.1" | quote }}
            {{- range .Values.gui.extraArgs }}
            - {{ . | toString | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          envFrom:
            # SECRET_KEY, ADMIN_TOKEN and OAUTH_* (never in the pod spec).
            - secretRef:
                name: {{ include "social-media-reuploader.guiSecretName" . }}
            {{- with .Values.gui.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: REQUESTS_DB
              value: {{ include "social-media-reuploader.dbPath" . | quote }}
            {{- with include "social-media-reuploader.renderEnv" (dict "values" $env "source" "env" "target" "gui" "skip" $skip) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "social-media-reuploader.renderEnv" (dict "values" $guiEnv "source" "gui.env" "target" "gui" "skip" (list)) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.gui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            {{- with .Values.gui.probes.startup }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- with .Values.gui.probes.liveness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            {{- with .Values.gui.probes.readiness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.guiResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.db.pvc.mountPath | default "/app/data" }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.gui.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "social-media-reuploader.dbClaimName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.gui.tmpSizeLimit | default "256Mi" }}
        {{- with .Values.gui.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
