{{- if include "social-media-reuploader.createBotSecret" . -}}
{{- $token := include "social-media-reuploader.botTokenValue" . -}}
{{- $webhookSecret := include "social-media-reuploader.webhookSecretValue" . -}}
{{- if not $token -}}
{{- fail "secret.create is true but no bot token was given: set secret.botToken (e.g. --set-string secret.botToken=...) or reference an existing Secret with secret.name" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "social-media-reuploader.botSecretName" . }}
  labels:
    {{- include "social-media-reuploader.labels" . | nindent 4 }}
    app.kubernetes.io/component: bot
type: Opaque
data:
  {{ .Values.secret.botTokenKey | default "BOT_TOKEN" }}: {{ $token | b64enc | quote }}
  {{- if $webhookSecret }}
  {{ .Values.secret.webhookSecretKey | default "WEBHOOK_SECRET" }}: {{ $webhookSecret | b64enc | quote }}
  {{- end }}
{{- end }}
