{{- if include "social-media-reuploader.createGuiSecret" . -}}
{{- $name := include "social-media-reuploader.guiSecretName" . -}}
{{- $secrets := .Values.gui.secrets | default dict -}}
{{- /* Generated values survive upgrades: reuse them from the live Secret. */ -}}
{{- $current := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $current = .data | default dict -}}
{{- end -}}
{{- $oauth := or $secrets.oauthClientId $secrets.oauthServerMetadataUrl $secrets.oauthAuthorizeUrl -}}
{{- $keys := dict
  "oauthClientId" "OAUTH_CLIENT_ID"
  "oauthClientSecret" "OAUTH_CLIENT_SECRET"
  "oauthServerMetadataUrl" "OAUTH_SERVER_METADATA_URL"
  "oauthAuthorizeUrl" "OAUTH_AUTHORIZE_URL"
  "oauthTokenUrl" "OAUTH_TOKEN_URL"
  "oauthUserinfoUrl" "OAUTH_USERINFO_URL"
  "oauthJwksUri" "OAUTH_JWKS_URI"
  "oauthScope" "OAUTH_SCOPE"
  "oauthRedirectUri" "OAUTH_REDIRECT_URI"
  "oauthAdminGroups" "OAUTH_ADMIN_GROUPS"
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "social-media-reuploader.labels" . | nindent 4 }}
    app.kubernetes.io/component: gui
type: Opaque
data:
  # Session signing key: given, or generated once (64 random characters).
  {{- if $secrets.secretKey }}
  SECRET_KEY: {{ $secrets.secretKey | toString | b64enc | quote }}
  {{- else if hasKey $current "SECRET_KEY" }}
  SECRET_KEY: {{ index $current "SECRET_KEY" | quote }}
  {{- else }}
  SECRET_KEY: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if $secrets.adminToken }}
  ADMIN_TOKEN: {{ $secrets.adminToken | toString | b64enc | quote }}
  {{- else if not $oauth }}
  # No OAuth configured: generated admin token, so the GUI can be used.
  {{- if hasKey $current "ADMIN_TOKEN" }}
  ADMIN_TOKEN: {{ index $current "ADMIN_TOKEN" | quote }}
  {{- else }}
  ADMIN_TOKEN: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- range $field, $key := $keys }}
  {{- with get $secrets $field }}
  {{ $key }}: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
