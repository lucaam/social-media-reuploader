apiVersion: v1
kind: Service
metadata:
  name: {{ include "social-media-reuploader.fullname" . }}
  labels:
    {{- include "social-media-reuploader.labels" . | nindent 4 }}
    app.kubernetes.io/component: bot
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    # /health, /metrics and (webhook mode) WEBHOOK_PATH
    - name: http
      port: {{ .Values.service.port | default 80 | int64 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "social-media-reuploader.selectorLabels" (list . "bot") | nindent 4 }}
