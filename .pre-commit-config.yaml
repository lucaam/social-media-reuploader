# Hooks run locally (`pre-commit install`) and in CI ("Python linters" job).
# Keep the ruff / black / isort revs equal to the pins in requirements-dev.txt.
# No `language_version` pins: hooks use the default `python3` (3.14 in CI).
minimum_pre_commit_version: "4.0.0"
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Fixtures are byte-exact copies of tool output.
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
        # Helm templates are not plain YAML.
        exclude: ^charts/social-media-reuploader/templates/
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: env PYTHONPATH=. pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      # The two hooks below need `helm` and `actionlint` on PATH. CI runs them
      # in dedicated jobs and skips them in the pre-commit job
      # (SKIP=helm-lint,actionlint).
      - id: helm-lint
        name: helm lint (charts)
        entry: helm lint charts/social-media-reuploader
        language: system
        files: ^charts/
        pass_filenames: false

      - id: actionlint
        name: actionlint (GitHub Actions linter)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: commitlint
        name: commitlint (Conventional Commits)
        entry: scripts/commit-msg-fix.sh
        language: script
        pass_filenames: true
        stages: [commit-msg]
