# Ruff configuration.
#
# The rule set is ruff's own default set (no `select` / `extend-select` on
# purpose): it already includes the checks this project relies on, e.g.
# blind excepts (BLE001), try-except-pass (S110), blocking calls in async code
# (ASYNC), bugbear (B), pyupgrade (UP), simplify (SIM) and logging (LOG).
# Keep the ruff version pinned in requirements-dev.txt and in
# .pre-commit-config.yaml so a ruff upgrade never changes the gate silently.
target-version = "py314"
line-length = 88
extend-exclude = ["site"]

[lint.isort]
known-first-party = ["src"]

[lint.per-file-ignores]
# Release helper invoked by the "Manual Version Bump" workflow. It is kept
# byte-for-byte unchanged in this refactor (it was fixed separately and its
# output format is parsed by CI); clean it up in a dedicated change and then
# drop this entry.
"scripts/release/bump_versions.py" = [
    "BLE001",
    "EXE001",
    "FURB105",
    "FURB167",
    "SIM115",
    "UP032",
]
