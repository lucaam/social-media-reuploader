name: Publish Release on Bump PR Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail
    shell: bash

jobs:
  release:
    name: Create release when bump PR is merged
    # Only for a merged bump PR (title: "chore(release): bump versions to vX.Y.Z").
    if: "github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'chore(release): bump versions to v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Extract version from PR title
        id: vars
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version=$(printf '%s' "$PR_TITLE" | sed -n 's/.*v\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
          if [ -z "$version" ]; then
            echo "::error::could not extract a version from the title: $PR_TITLE"
            exit 1
          fi
          {
            echo "tag=v${version}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release (and tag) on the merge commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "$TAG" \
            --notes "Automated release for ${TAG} created from bump PR #${PR_NUMBER}." \
            --generate-notes

  # A release created with GITHUB_TOKEN does not trigger docker-release.yml:
  # publish the image from here.
  docker:
    name: Publish the Docker image
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      push-latest: true
    secrets: inherit
