name: Manual Docker build and publish to GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v0.9.0'
        required: true
        type: string
      push-latest:
        description: 'Also move :latest (only done when the tag is the highest release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Publish ${{ inputs.tag }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ inputs.tag }}
      push-latest: ${{ inputs.push-latest }}
    secrets: inherit
