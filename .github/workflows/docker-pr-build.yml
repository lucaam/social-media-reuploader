name: PR Docker build (test)

# No workflow-level `paths:` filter: "Build Docker image (test)" is a required
# check, so it must always report. The build job is skipped (= success) when
# nothing that goes into the image changed.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail
    shell: bash

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - 'requirements.txt'
              - '.github/workflows/docker-pr-build.yml'

  build:
    name: Build Docker image (test)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-docker-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      IMAGE: smr-pr-${{ github.event.pull_request.number }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      - name: Smoke test the image
        run: |
          # Runtime pieces of yt-dlp: deno (YouTube), curl_cffi (impersonation), EJS.
          docker run --rm "$IMAGE" python -c "import curl_cffi, yt_dlp, yt_dlp_ejs; print('yt-dlp', yt_dlp.version.__version__)"
          docker run --rm "$IMAGE" python -m yt_dlp --version
          docker run --rm "$IMAGE" ffmpeg -hide_banner -version
          docker run --rm "$IMAGE" ffprobe -hide_banner -version
          # Unprivileged user, as in the Helm chart.
          test "$(docker run --rm "$IMAGE" id -u)" = "1000"
          # Like Kubernetes: read-only root filesystem, writable /tmp and data.
          docker run --rm --read-only --tmpfs /tmp --tmpfs /app/data "$IMAGE" \
            deno eval "console.log('deno', Deno.version.deno)"
          # Every entrypoint imports with the environment the chart renders
          # (numbers as plain strings, the DB on the data volume).
          docker run --rm --read-only --tmpfs /tmp --tmpfs /app/data \
            -e BOT_TOKEN=123456:smoke-test-not-a-token \
            -e SECRET_KEY=smoke-test-secret-key-0123456789abcdef0123456789 \
            -e ADMIN_TOKEN=smoke-test-admin-token-0123456789 \
            -e TELEGRAM_MAX_FILE_SIZE=52428800 \
            -e REQUESTS_DB=/app/data/requests.db \
            "$IMAGE" python -c "import src.config, src.db, src.providers, src.downloader, src.media, src.worker, src.bot, src.gui; src.db.init_db(); print('imports ok')"
