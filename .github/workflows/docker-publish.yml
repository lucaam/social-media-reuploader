name: Docker publish (reusable)

# Builds the image of a release tag for linux/amd64 + linux/arm64 and pushes it
# to GHCR. Called by:
#   - docker-release.yml          (release published from the GitHub UI)
#   - publish-bump-release.yml    (release created by the bump-PR flow: events of
#                                  GITHUB_TOKEN never trigger other workflows, so
#                                  that workflow calls this one directly)
#   - docker-release-manual.yml   (manual rebuild of an existing tag)
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.9.0
        required: true
        type: string
      push-latest:
        description: Also move :latest (only done when the tag is the highest release)
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

defaults:
  run:
    # bash -eo pipefail
    shell: bash

jobs:
  publish:
    name: Build and push ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Compute image tags
        id: meta
        env:
          TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push-latest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version="${TAG#v}"
          version="${version#V}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
          tags="${IMAGE}:${version}"
          # Never move :latest back to an older release.
          highest="$(git tag --list 'v[0-9]*' --sort=-v:refname)"
          highest="${highest%%$'\n'*}"
          if [ "$PUSH_LATEST" = "true" ] && [ "$highest" = "$TAG" ]; then
            tags="${tags},${IMAGE}:latest"
          else
            echo "::notice::not moving :latest (push-latest=$PUSH_LATEST, highest tag $highest)"
          fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VCS_REF=${{ steps.meta.outputs.revision }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Make the GHCR package public (optional, needs GHCR_PAT)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "${GHCR_PAT:-}" ]; then
            echo "GHCR_PAT not set: skipping the visibility change"
            exit 0
          fi
          for endpoint in "orgs/${OWNER}" "user"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${GHCR_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/${endpoint}/packages/container/${REPO}/visibility" \
              -d '{"visibility":"public"}' || true)
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
              echo "GHCR package visibility set to public (${endpoint})"
              exit 0
            fi
            echo "${endpoint} endpoint returned ${code}"
          done
          echo "::warning::could not change the GHCR package visibility (GHCR_PAT needs package admin rights)"
