name: Manual Version Bump

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # to dispatch CI on the bump branch (without RELEASE_TOKEN)
  actions: write

defaults:
  run:
    # bash -eo pipefail
    shell: bash

jobs:
  bump:
    name: Bump versions and open PR
    runs-on: ubuntu-latest
    env:
      # A branch pushed and a pull request opened with GITHUB_TOKEN start no
      # workflows, so the required checks of the bump PR (lint, commitlint,
      # Docker build) would never report. With the RELEASE_TOKEN secret (a
      # fine-grained personal access token with read/write "Contents" and
      # "Pull requests" on this repository) the branch is pushed and the PR
      # opened with it instead, and every pull_request workflow runs.
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The bump script pushes the branch with these credentials.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.14'

      - name: Run bump script
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prints the branch and the version on two lines (empty: nothing to release).
          python3 scripts/release/bump_versions.py > bump-output.txt || true
          {
            echo "branch=$(sed -n '1p' bump-output.txt)"
            echo "version=$(sed -n '2p' bump-output.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.bump.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Automated version bump to v${VERSION}."
            echo
            echo "Merging this PR creates the release v${VERSION} and publishes the Docker image."
            if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
              echo
              echo "Opened with GITHUB_TOKEN (no RELEASE_TOKEN secret): only CI was started on the branch."
              echo "Close and reopen this PR to run the other required checks (see RELEASE.md)."
            fi
            echo
            echo "Commits:"
            if [ -n "$last_tag" ]; then
              git log --pretty=format:'- %s' "${last_tag}..HEAD"
            else
              git log --pretty=format:'- %s' HEAD
            fi
          } > pr-body.md
          gh pr create --title "chore(release): bump versions to v${VERSION}" \
            --body-file pr-body.md --head "$BRANCH" --base main

      - name: Run CI on the bump branch (no RELEASE_TOKEN)
        if: steps.bump.outputs.branch != '' && env.HAS_RELEASE_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        # The PR was opened with GITHUB_TOKEN, which starts no workflows, but
        # workflow_dispatch does: run the tests on the bump commit. The other
        # required checks only run when someone closes and reopens the PR.
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          echo "::warning::Bump PR opened with GITHUB_TOKEN: only CI runs. Close and reopen the PR to run lint, commitlint and the Docker build, or set the RELEASE_TOKEN secret (RELEASE.md)."
