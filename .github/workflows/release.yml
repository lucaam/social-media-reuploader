name: Release

# Continuous delivery: every push to main is checked and, when it brings a
# releasable Conventional Commit (feat, fix, perf, revert, build(deps) or a
# breaking change: see scripts/release/version.py), released with no manual
# step:
#
#   gate (ci.yml) --> version --> image --> chart --> release
#                                 (tested, attested, signed, then tagged;
#                                  the chart only once its image exists)
#
# The tag vX.Y.Z is the only record of a release: nothing is committed back
# to main, the version is injected at build time (image: --build-arg VERSION;
# chart: helm package --version/--app-version). Image and chart are published
# before the tag: a failed run leaves no tag, and the next push to main (or
# "Re-run failed jobs" on that same run) publishes that version again. Events
# of GITHUB_TOKEN start no other workflow, so everything happens in this run.
#
# Manual runs (Actions > Release > Run workflow, branch main):
#   bump: release at least this level, also without releasable commits;
#   tag:  publish the image and the chart of an existing release again.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Minimum bump (auto: from the commits; major on 0.y.z releases 1.0.0)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      tag:
        description: "Existing release tag to publish again, e.g. v0.9.0 (empty: cut a new release)"
        type: string
        default: ""

permissions: {}

concurrency:
  # One release at a time, never cancelled midway. A newer run waits; when
  # another one arrives the waiting run is replaced. A replaced push run loses
  # nothing when its replacement cuts a release (it reads every commit since
  # the latest tag); a manual `tag` run does not, so its commits wait for the
  # next push (or a manual run with bump=auto).
  group: release
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail
    shell: bash

env:
  PYTHON_VERSION: "3.14"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.2
  CHART_PATH: charts/social-media-reuploader
  CHART_NAME: social-media-reuploader

jobs:
  gate:
    name: Gate
    # A republished tag passed the gate when it was released.
    if: github.event_name == 'push' || inputs.tag == ''
    # The `$/` self-repository form is not accepted by actionlint 1.7.12 yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read # granted to ci.yml, whose "changes" job asks for it

  version:
    name: Version
    needs: gate
    # After a green gate, or without it when republishing a tag.
    if: >-
      ${{ !cancelled() && (needs.gate.result == 'success' ||
      (needs.gate.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      new: ${{ steps.plan.outputs.new }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      latest: ${{ steps.plan.outputs.latest }}
      stable: ${{ steps.plan.outputs.stable }}
      image: ${{ steps.names.outputs.image }}
      chart-repo: ${{ steps.names.outputs.chart-repo }}
      chart: ${{ steps.names.outputs.chart }}
    steps:
      - name: Releases come from main only
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::run the release workflow on main, not on $REF"
          exit 1

      - name: Checkout (every commit and tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Registry names (lower case)
        id: names
        run: |
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "chart-repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
            echo "chart=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/$CHART_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Plan the release
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          REPUBLISH: ${{ inputs.tag }}
          IMAGE: ${{ steps.names.outputs.image }}
          CHART: ${{ steps.names.outputs.chart }}
        run: |
          python scripts/release/version.py plan \
            --bump "$BUMP" --republish "$REPUBLISH" \
            --image "$IMAGE" --chart "$CHART" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --github-output "$GITHUB_OUTPUT" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: A new release needs the gate
        if: steps.plan.outputs.new == 'true' && needs.gate.result != 'success'
        run: |
          echo "::error::the gate did not run: refusing to cut a new release"
          exit 1

      - name: Keep the release notes
        if: steps.plan.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # The jobs below test results explicitly: an implicit success() would also
  # skip them when the gate is skipped (republishing a tag).
  image:
    name: Image
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read # also: does the release tag exist yet?
      packages: write # push to ghcr.io
      id-token: write # keyless signature and attestation (Sigstore)
      attestations: write # GitHub artifact attestation
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # "Re-run failed jobs" reuses the version of the first attempt: never
      # publish over a release that another run has cut in the meantime.
      - name: The release is still pending
        if: needs.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is released already (by a newer run): nothing to publish"
            exit 1
          fi

      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Set up QEMU (linux/arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z always; X.Y, X (from 1.0.0 on) and latest only for the highest
      # release (never when republishing an older tag); sha-<short> of the
      # released commit, which is also the revision (with the default
      # workflow context they would name the commit of this run).
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotations on the image index too (GHCR shows those).
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ needs.version.outputs.latest == 'true' }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ needs.version.outputs.latest == 'true' && needs.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.latest == 'true' }}
            type=raw,value=sha-${{ needs.version.outputs.short_sha }}
          # The repository has no description or license on GitHub: without
          # these the generated values would blank the Dockerfile labels.
          labels: |
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.description=Telegram bot that re-posts the media behind social-network links (every site supported by yt-dlp), with an admin GUI
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://lucaam.github.io/social-media-reuploader/
          annotations: |
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.description=Telegram bot that re-posts the media behind social-network links (every site supported by yt-dlp), with an admin GUI
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://lucaam.github.io/social-media-reuploader/

      # Pushed by digest only: no tag points at the image before it passed
      # the smoke test and is attested and signed.
      - name: Build and push by digest (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=release
            type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=release

      - name: Smoke test the pushed image (both platforms)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "$platform" "$IMAGE@$DIGEST"
            scripts/smoke_test_image.sh "$IMAGE@$DIGEST" "$VERSION" "$platform"
          done

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # A single index source is copied as-is, so every tag names the very
      # digest that was tested, attested and signed (checked below).
      - name: Tag the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            tagged="$(docker buildx imagetools inspect "$tag" --format '{{ .Manifest.Digest }}')"
            if [ "$tagged" != "$DIGEST" ]; then
              echo "::error::$tag is $tagged, not the signed $DIGEST"
              exit 1
            fi
          done
          {
            echo "### Image \`$IMAGE@$DIGEST\`"
            echo
            echo '```text'
            printf '%s\n' "${tags[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # After the image: a published chart always has its image.
  chart:
    name: Chart
    needs: [version, image]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
      needs.version.outputs.release == 'true' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # also: does the release tag exist yet?
      packages: write # push to oci://ghcr.io/<owner>/charts
      id-token: write # keyless signature and attestation (Sigstore)
      attestations: write # GitHub artifact attestation
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      CHART_REPO: ${{ needs.version.outputs.chart-repo }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: The release is still pending
        if: needs.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG is released already (by a newer run): nothing to publish"
            exit 1
          fi

      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package the chart (version and appVersion of the release)
        id: package
        run: |
          helm package "$CHART_PATH" --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
          tgz="$RUNNER_TEMP/chart/$CHART_NAME-$VERSION.tgz"
          # The chart must deploy the image of its own release.
          helm template smr "$tgz" --set secret.name=smr-bot > "$RUNNER_TEMP/rendered.yaml"
          grep "image: \"$IMAGE:$VERSION\"" "$RUNNER_TEMP/rendered.yaml"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"

      # Docker credentials for cosign and the attestation push; helm keeps
      # its own.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR (OCI)
        id: push
        env:
          TGZ: ${{ steps.package.outputs.tgz }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$TGZ" "oci://$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest in the helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the provenance of the OCI chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REPO }}/${{ env.CHART_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the provenance of the chart archive (release asset)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.tgz }}

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the OCI chart (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$CHART_REPO/$CHART_NAME@$DIGEST"

      - name: Keep the chart archive for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ${{ steps.package.outputs.tgz }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [version, image, chart]
    if: >-
      ${{ !cancelled() && needs.version.outputs.new == 'true' &&
      needs.image.result == 'success' && needs.chart.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
      VERSION: ${{ needs.version.outputs.version }}
      LATEST: ${{ needs.version.outputs.latest }}
      IMAGE: ${{ needs.version.outputs.image }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      CHART: ${{ needs.version.outputs.chart }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
    steps:
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Download the chart archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: ${{ runner.temp }}/chart

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes/release-notes.md"
          {
            echo
            echo "### Artifacts"
            echo
            echo "- image \`$IMAGE:$VERSION\` (\`$IMAGE_DIGEST\`), linux/amd64 and linux/arm64"
            echo "- chart \`$CHART\` $VERSION (\`$CHART_DIGEST\`), also attached below"
            echo
            echo "Both are signed with cosign (keyless) and attested:" \
              "[how to verify them]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$SHA/docs/ghcr.md#verificare-firme-e-provenienza)."
          } >> "$notes"
          # A tag is never moved: with an existing tag gh would ignore --target.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::the tag $TAG exists already"
            exit 1
          fi
          # gh uploads the assets to a draft and then publishes it, which
          # creates the tag on $SHA (compatible with immutable releases).
          gh release create "$TAG" "$RUNNER_TEMP/chart/"*.tgz \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" \
            --notes-file "$notes" --latest="$LATEST"
          echo "### Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
