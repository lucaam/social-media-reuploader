name: CI

# Every check a change must pass, defined once:
#   - on pull requests: the job names are required status checks of the
#     `main` ruleset (rename a job only together with the ruleset);
#   - on every push to main, called by release.yml as the release gate.
# On pull requests the jobs of the areas a change does not touch are skipped
# (a skipped job counts as passed); called from release.yml every job runs,
# except the release dry run (pull requests only, not a required check).
on:
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  # A new push to a pull request cancels the run of the previous one. Called
  # from release.yml: one group per run (release.yml serializes releases).
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash -eo pipefail
    shell: bash

env:
  PYTHON_VERSION: "3.14"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.2
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest extractVersion=^v(?<version>.+)$
  HELM_UNITTEST_VERSION: 1.2.1
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  # The build tools of release.yml (keep the same pins, tests/test_release_workflow.py
  # checks them): BuildKit and the SBOM generator it runs.
  # renovate: datasource=docker
  BUILDKIT_IMAGE: moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
  # renovate: datasource=docker
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
  # Version of the release dry run (never published).
  DRY_RUN_VERSION: 0.0.1-dryrun

jobs:
  changes:
    name: Determine changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the files of the pull request
    outputs:
      # Outside pull requests (the release gate) every area counts as changed.
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      release: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release == 'true' }}
    steps:
      # Pull requests: the changed files come from the API, no checkout.
      - name: Filter changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - Dockerfile
              - .dockerignore
              - requirements.txt
              - 'src/**'
              - scripts/smoke_test_image.sh
              - .github/workflows/ci.yml
            helm:
              - 'charts/**'
              - .github/workflows/ci.yml
            workflows:
              - '.github/workflows/**'
              - .pre-commit-config.yaml
            docs:
              - 'docs/**'
              - mkdocs.yml
              - README.md
              - scripts/mkdocs_hooks.py
              - requirements-dev.txt
              - .github/workflows/ci.yml
            release:
              - .github/workflows/release.yml
              - .github/workflows/ci.yml
              - 'scripts/release/**'
              - Dockerfile
              - 'charts/**'

  # Required status check "build": the test suite.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg (the media tests need ffmpeg/ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check the yt-dlp runtime pieces
        run: |
          deno --version
          python -c "import curl_cffi, yt_dlp, yt_dlp_ejs; print('yt-dlp', yt_dlp.version.__version__)"
          ffmpeg -hide_banner -version | sed -n 1p

      - name: Run tests
        env:
          REQUESTS_DB: ${{ runner.temp }}/requests.db
        run: python -m pytest -q

  python-lint:
    name: Python linters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Every hook of .pre-commit-config.yaml (all pinned there) except the
      # ones the jobs below run: helm-lint ("Helm chart lint", needs helm) and
      # the workflow checks ("GitHub Actions linter (actionlint)").
      - name: Pre-commit hooks (all files)
        env:
          SKIP: helm-lint,actionlint,check-github-workflows,check-github-workflows-require-timeout,zizmor
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Every setting is documented (README, Helm values)
        run: python scripts/check_docs.py

  helm-lint:
    name: Helm chart lint
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CHART: charts/social-media-reuploader
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm lint (default and CI values)
        run: |
          helm lint "$CHART" --strict
          for values in "$CHART"/ci/*-values.yaml; do
            helm lint "$CHART" --strict -f "$values"
          done

      - name: Helm unit tests (helm-unittest)
        run: |
          # Helm 4 cannot verify plugins installed from git (see the
          # helm-unittest README).
          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --version "$HELM_UNITTEST_VERSION" --verify=false
          helm unittest "$CHART"

      - name: Validate the rendered manifests (kubeconform)
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o kubeconform-linux-amd64.tar.gz "$base/kubeconform-linux-amd64.tar.gz"
          curl -sSfL --retry 3 -o CHECKSUMS "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check --strict -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          cd "$GITHUB_WORKSPACE"
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::$values"
            helm template smr "$CHART" -f "$values" \
              | "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      # The release workflow publishes the chart packaged with the release
      # version: the package must deploy the image of that same version.
      - name: Package the chart as the release does
        run: |
          helm package "$CHART" --version 0.0.1-ci --app-version 0.0.1-ci --destination "$RUNNER_TEMP/chart"
          helm template smr "$RUNNER_TEMP/chart/social-media-reuploader-0.0.1-ci.tgz" \
            --set secret.name=smr-bot > "$RUNNER_TEMP/rendered.yaml"
          grep 'image: "ghcr.io/lucaam/social-media-reuploader:0.0.1-ci"' "$RUNNER_TEMP/rendered.yaml"

  workflows-lint:
    name: GitHub Actions linter (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Pinned in .pre-commit-config.yaml: actionlint (with shellcheck for the
      # run: scripts), the workflow JSON schema, a timeout on every job and
      # the zizmor security audits.
      - name: actionlint, workflow schema and zizmor
        run: |
          for hook in actionlint check-github-workflows check-github-workflows-require-timeout zizmor; do
            pre-commit run "$hook" --all-files --show-diff-on-failure
          done

  docs-build:
    name: Docs build (mkdocs --strict)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the documentation
        run: mkdocs build --strict

  docker:
    name: Build Docker image (test)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: smr-ci:${{ github.sha }}
      VERSION: 0.0.0-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # The only image build with a cache: the release builds from scratch.
      - name: Build (linux/amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=ci
          # Written on main only; pull requests read the cache of main.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=ci' || '' }}

      - name: Smoke test the image
        run: scripts/smoke_test_image.sh "$IMAGE" "$VERSION"

  # The release rehearsed on pull requests (release.yml only runs on main):
  # the plan, the image metadata, the chart as published and, below, both
  # image builds, with the actions and inputs of release.yml. So a change of
  # the release (a Renovate ci(deps) update included) and the arm64 image
  # are tried before a release needs them. Nothing leaves the runner: the
  # pushes go to a throwaway local registry. Not a required check.
  release-dry-run:
    name: Release dry run (plan, chart)
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.release == 'true' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    outputs:
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
    steps:
      - name: Checkout (every commit and tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # On the merge of the pull request into main, so the tags of main are
      # in its history. (The "commitlint" check tells what the squash merge
      # releases: this plan counts every commit of the branch.) A re-run of
      # an old check reuses the old merge commit, so the current main is
      # added as a second parent: a release made since then is in the
      # history instead of failing the plan as a tag outside it.
      - name: Plan the release (dry run)
        id: plan
        env:
          GIT_AUTHOR_NAME: release dry run
          GIT_AUTHOR_EMAIL: dry-run@invalid
          GIT_COMMITTER_NAME: release dry run
          GIT_COMMITTER_EMAIL: dry-run@invalid
        run: |
          ref="$(git commit-tree "HEAD^{tree}" -p HEAD -p origin/main -m 'release dry run')"
          python scripts/release/version.py plan --ref "$ref" --summary-file "$GITHUB_STEP_SUMMARY"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The tags of release.yml, for a stable release that moves `latest`.
      - name: Image tags and OCI labels (as release.yml)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.plan.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=1.2.3
            type=semver,pattern={{major}}.{{minor}},value=1.2.3,enable=true
            type=semver,pattern={{major}},value=1.2.3,enable=true
            type=raw,value=latest,enable=true
            type=raw,value=sha-0123456
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      # The steps of release.yml (jobs chart and publish), pushed to the
      # local registry.
      - name: Package and push the chart (local registry)
        env:
          CHART: charts/social-media-reuploader
          IMAGE: ${{ steps.plan.outputs.image }}
        run: |
          helm package "$CHART" --version "$DRY_RUN_VERSION" --app-version "$DRY_RUN_VERSION" \
            --destination "$RUNNER_TEMP/chart"
          tgz="$RUNNER_TEMP/chart/social-media-reuploader-$DRY_RUN_VERSION.tgz"
          helm template smr "$tgz" --set secret.name=smr-bot > "$RUNNER_TEMP/rendered.yaml"
          grep "image: \"$IMAGE:$DRY_RUN_VERSION\"" "$RUNNER_TEMP/rendered.yaml"
          helm push "$tgz" oci://localhost:5000/charts --plain-http 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest in the helm push output"
            exit 1
          fi
          helm show chart oci://localhost:5000/charts/social-media-reuploader \
            --version "$DRY_RUN_VERSION" --plain-http

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      # Signing needs the OIDC token of a release: only the install is tried.
      - name: cosign is installed
        run: cosign version

  release-dry-run-image:
    name: Release dry run (image ${{ matrix.platform }})
    needs: release-dry-run
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    env:
      IMAGE: localhost:5000/social-media-reuploader
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Host network: BuildKit reaches the local registry on localhost.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
            network=host
          cache-binary: false

      - name: Log in to the local registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: localhost:5000
          username: dry-run
          password: dry-run

      # The inputs of release.yml (tests/test_release_workflow.py compares
      # them), except where it pushes to.
      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.release-dry-run.outputs.labels }}
          annotations: ${{ needs.release-dry-run.outputs.annotations }}
          build-args: VERSION=${{ env.DRY_RUN_VERSION }}
          provenance: mode=max
          attests: type=sbom,generator=${{ env.SBOM_GENERATOR }}
          no-cache: true

      - name: Smoke test the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker pull --quiet --platform "$PLATFORM" "$IMAGE@$DIGEST"
          scripts/smoke_test_image.sh "$IMAGE@$DIGEST" "$DRY_RUN_VERSION" "$PLATFORM"

      - name: The image has its SBOM and provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for kind in SBOM Provenance; do
            docker buildx imagetools inspect "$IMAGE@$DIGEST" --format "{{ json .$kind }}" \
              > "$RUNNER_TEMP/$kind.json"
          done
          jq -e '.SPDX.spdxVersion' "$RUNNER_TEMP/SBOM.json"
          jq -e '.SLSA.buildDefinition.buildType' "$RUNNER_TEMP/Provenance.json"

  # One stable, non-matrix check that sums up the release dry run, so it can
  # be made required (the per-platform names of a skipped matrix job are
  # never reported, so they would stay pending forever). Skipped dry runs
  # (no release/docker change) pass; a failed or cancelled leg fails it. With
  # it required, Renovate's yt-dlp automerge also waits for both image builds.
  release-dry-run-result:
    name: Release dry run
    needs: [release-dry-run, release-dry-run-image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every dry-run job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::release dry run: $result"; exit 1 ;;
            esac
          done
          echo "release dry run: $RESULTS"
