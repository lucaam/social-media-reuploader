name: Lint and Static Checks (conditional)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash -eo pipefail
    shell: bash

env:
  HELM_VERSION: v4.3.2
  HELM_UNITTEST_VERSION: 1.2.1
  KUBECONFORM_VERSION: v0.8.0
  ACTIONLINT_VERSION: 1.7.12

jobs:
  # Jobs skipped by their `if:` still report success, so the required checks
  # are satisfied on pull requests that do not touch their area.
  filter:
    name: Determine changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      helm: ${{ steps.filter.outputs.helm }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            helm:
              - 'charts/**'
            workflows:
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'
              - 'scripts/mkdocs_hooks.py'
              - 'requirements-dev.txt'

  # Not filtered: besides ruff/black/isort, pre-commit checks whitespace, end
  # of file and YAML syntax of every file (docs, workflows, examples, compose),
  # and check_docs.py ties README.md to the code. A skipped run would let
  # problems land and fail a later, unrelated pull request.
  python-lint:
    name: Python linters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks (all files)
        env:
          # helm lint and actionlint run in their own jobs below.
          SKIP: helm-lint,actionlint
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Every setting is documented (README, Helm values)
        run: python scripts/check_docs.py

  helm-lint:
    name: Helm chart lint
    needs: filter
    if: needs.filter.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm lint (default and CI values)
        run: |
          chart=charts/social-media-reuploader
          helm lint "$chart" --strict
          for values in "$chart"/ci/*-values.yaml; do
            helm lint "$chart" --strict -f "$values"
          done

      - name: Helm unit tests (helm-unittest)
        run: |
          # Helm 4 cannot verify plugins installed from git (see helm-unittest README).
          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --version "$HELM_UNITTEST_VERSION" --verify=false
          helm unittest charts/social-media-reuploader

      - name: Validate rendered manifests (kubeconform)
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xzf - -C "$RUNNER_TEMP" kubeconform
          chart=charts/social-media-reuploader
          for values in "$chart"/ci/*-values.yaml; do
            echo "::group::$values"
            helm template smr "$chart" -f "$values" \
              | "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  workflows-lint:
    name: GitHub Actions linter (actionlint)
    needs: filter
    if: needs.filter.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  docs-build:
    name: Docs build (mkdocs --strict)
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build the documentation
        run: mkdocs build --strict
