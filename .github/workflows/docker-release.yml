name: Build and publish Docker image to GHCR on release

# Runs for releases published by a person (GitHub UI / gh CLI). Releases created
# by workflows with GITHUB_TOKEN do not trigger this workflow:
# publish-bump-release.yml calls docker-publish.yml itself.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Publish ${{ github.event.release.tag_name }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      push-latest: ${{ !github.event.release.prerelease }}
    secrets: inherit
