apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: social-media-reuploader
  namespace: smr
spec:
  interval: 10m
  # The OCI chart of ocirepository.yaml (same namespace).
  chartRef:
    kind: OCIRepository
    name: social-media-reuploader
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    # The image tag defaults to the chart's appVersion, i.e. the image of
    # the same release: set image.tag only to deploy a different release.
    # Existing Secrets (create them with SealedSecrets / External Secrets /
    # SOPS; never commit secrets):
    #   smr-bot: BOT_TOKEN (optional WEBHOOK_SECRET)
    #   smr-gui: SECRET_KEY and ADMIN_TOKEN, or the OAUTH_* settings
    secret:
      name: smr-bot
    gui:
      existingSecret: smr-gui
      env:
        SESSION_COOKIE_SECURE: true
    env:
      MODE: polling
      MAX_PENDING_PER_CHAT: 3
      UNSUPPORTED_LINK_REPLY: private
    # Optional: cookies.txt for sites that need a login
    # ytdlpCookies:
    #   existingSecret: smr-cookies
    # Optional: expose the GUI over HTTPS
    # ingress:
    #   enabled: true
    #   className: nginx
    #   hosts:
    #     - host: admin.example.com
    #       paths:
    #         - path: /
    #           service: gui
    #   tls:
    #     - secretName: admin-example-tls
    #       hosts: [admin.example.com]
