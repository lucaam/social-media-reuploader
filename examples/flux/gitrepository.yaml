apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: social-media-reuploader-repo
  namespace: flux-system
spec:
  interval: 10m
  # Replace with your Git repository URL (SSH or HTTPS)
  url: https://github.com/lucaam/social-media-reuploader.git
  ref:
    # The newest release tag (vX.Y.Z): the chart of a release deploys the image
    # of the same version. Do not follow `branch: main`, whose chart may need an
    # image that is not released yet. Releases up to v0.8.1 ship the old chart
    # (which does not match helmrelease.yaml), hence the range.
    # For reproducible deploys pin one release instead: `tag: vX.Y.Z`.
    semver: ">0.8.1"
  # Only the chart is needed
  ignore: |
    /*
    !/charts/
