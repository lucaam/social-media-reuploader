apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: social-media-reuploader-repo
  namespace: flux-system
spec:
  interval: 10m
  # Replace with your Git repository URL (SSH or HTTPS)
  url: https://github.com/lucaam/social-media-reuploader.git
  ref:
    # For reproducible deploys pin a release instead: `tag: vX.Y.Z`
    # (the chart of that tag deploys the image of the same version).
    branch: main
  # Only the chart is needed
  ignore: |
    /*
    !/charts/
